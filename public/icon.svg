<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#0f766e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134e4a;stop-opacity:1" />
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#grad)" stroke="#5eead4" stroke-width="8" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="8,8" />
  
  <text x="50%" y="42%" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central" style="direction: rtl;">الرقيّة</text>
  <text x="50%" y="65%" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="central" style="direction: rtl;">الشرعيّة</text>

  <!-- Simpler Islamic Decoration (Border Pattern) -->
  <g opacity="0.2">
    <circle cx="256" cy="256" r="210" fill="none" stroke="white" stroke-width="1" />
    <circle cx="256" cy="256" r="215" fill="none" stroke="white" stroke-width="0.5" stroke-dasharray="10,20" />
    
    <g transform="translate(256, 256)">
      <rect x="-240" y="-1" width="480" height="2" fill="white" transform="rotate(0)" />
      <rect x="-240" y="-1" width="480" height="2" fill="white" transform="rotate(45)" />
      <rect x="-240" y="-1" width="480" height="2" fill="white" transform="rotate(90)" />
      <rect x="-240" y="-1" width="480" height="2" fill="white" transform="rotate(135)" />
    </g>
  </g>
</svg>
